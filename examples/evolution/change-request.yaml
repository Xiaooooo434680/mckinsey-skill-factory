id: CR-2026-001
skill_name: sales-opportunity-diagnosis
reason: CRM 活动数据偶尔缺失，需要增加降级流程并强化低置信度输出约束
requested_by: revenue-operations
evolution_type: corrective
version_bump: auto
owner_approval: false
acceptance_criteria:
  - CRM 活动历史不可用时返回 partial，不得虚构活动记录
  - confidence 低于 0.5 时不得输出确定性机会评分
operations:
  - component: workflow
    action: update
    selector: S4
    rationale: 为 CRM 活动历史查询增加明确降级行为
    value:
      fallback: 标记 activity_history 缺失，继续使用其他证据并返回 partial
  - component: guardrails
    action: add
    rationale: 防止在活动数据缺失时虚构客户互动
    value: CRM 活动历史不可用时，不得推断或虚构客户互动记录
  - component: evaluation
    action: update
    rationale: 提高工具失败场景的评估权重
    value:
      metrics:
        task_success: 0.25
        factuality: 0.20
        tool_selection_accuracy: 0.10
        policy_compliance: 0.15
        actionability: 0.10
        output_schema_validity: 0.10
        failure_handling: 0.10
rollback_strategy: 使用 rollback 目录中的 0.1.0 完整包恢复
